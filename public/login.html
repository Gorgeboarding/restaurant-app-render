<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단체 식당 검색 | 로그인</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f8;font-family:Arial,"Noto Sans KR",sans-serif;color:#222}
    .box{width:min(100%,380px);background:white;padding:34px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
    h1{margin:0 0 8px}p{color:#666;font-size:14px}
    input,button{width:100%;height:46px;margin-top:10px;border-radius:8px;font-size:16px}
    input{border:1px solid #ccc;padding:0 12px}
    button{border:0;background:#222;color:white;cursor:pointer}
    #message{color:#c62828;min-height:20px;text-align:center}
  </style>
</head>
<body>
  <main class="box">
    <h1>단체 식당 검색</h1>
    <p>비밀번호를 입력해주세요.</p>
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" type="button">로그인</button>
    <div id="message"></div>
  </main>

  <script>
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    async function login() {
      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password.value })
      });

      const result = await response.json();

      if (result.success) location.href = "/restaurants";
      else message.textContent = result.message || "로그인 실패";
    }

    loginBtn.addEventListener("click", login);
    password.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
