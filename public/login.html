<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단체 식당 검색 | 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .login-box {
      width: min(100%, 380px);
      background: #fff;
      padding: 34px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 24px; color: #666; font-size: 14px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #202124;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      min-height: 20px;
      margin-top: 14px;
      color: #c62828;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>단체 식당 검색</h1>
    <p>허가된 사용자만 접근할 수 있습니다.</p>

    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" />

    <button id="loginBtn" type="button">로그인</button>
    <div id="message" aria-live="polite"></div>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    async function login() {
      const password = passwordInput.value;

      if (!password) {
        message.textContent = "비밀번호를 입력해주세요.";
        return;
      }

      loginBtn.disabled = true;
      message.textContent = "";

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = "/restaurants";
          return;
        }

        message.textContent = result.message || "로그인에 실패했습니다.";
      } catch (error) {
        message.textContent = "서버 연결에 실패했습니다.";
      } finally {
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });
  </script>
</body>
</html>
