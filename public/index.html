<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단체 식당 검색</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: min(1180px, 92%);
      margin: 34px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin: 6px 0 0;
    }

    .logout {
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #fff;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .control-group {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    select {
      display: block;
      width: 100%;
      height: 46px;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 0 12px;
      background: #fff;
      font-size: 15px;
    }

    .location-info {
      min-height: 18px;
      margin-top: 8px;
      color: #666;
      font-size: 13px;
    }

    .helper {
      min-height: 18px;
      margin-top: 8px;
      color: #666;
      font-size: 13px;
    }

    .meta {
      margin: 14px 2px;
      color: #666;
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 16px;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #fafafa;
    }

    .name {
      font-weight: 700;
    }

    .phone a {
      color: inherit;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 720px) {
      .header {
        align-items: flex-start;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="header">
      <div>
        <h1>단체 식당 검색</h1>
        <p class="subtitle">
          장소와 반경을 선택하면 조건에 맞는 식당이 바로 표시됩니다.
        </p>
      </div>

      <button class="logout" id="logoutBtn" type="button">
        로그아웃
      </button>
    </div>

    <section class="controls">

      <div class="control-group">
        <label for="location">
          기준 장소
        </label>

        <select id="location"></select>

        <div
          id="locationInfo"
          class="location-info"
        ></div>
      </div>


      <div class="control-group">
        <label for="radius">
          반경
        </label>

        <select id="radius">
          <option value="1">
            1 km
          </option>

          <option value="3">
            3 km
          </option>

          <option value="5">
            5 km
          </option>

          <option value="10" selected>
            10 km
          </option>
        </select>

        <div class="helper">
          선택한 거리 이내의 식당만 표시됩니다.
        </div>
      </div>

    </section>


    <div
      id="meta"
      class="meta"
    >
      데이터를 불러오는 중...
    </div>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>순위</th>
            <th>음식점 이름</th>
            <th>대표메뉴</th>
            <th>거리</th>
            <th>인당 비용</th>
            <th>전화번호</th>
          </tr>
        </thead>

        <tbody id="restaurantBody"></tbody>

      </table>

      <div
        id="empty"
        class="empty"
        hidden
      >
        조건에 맞는 식당이 없습니다.
      </div>

    </div>

  </main>


  <script>

    let locations = [];
    let restaurants = [];
    let updatedAt = "";


    const locationSelect =
      document.getElementById("location");

    const radiusSelect =
      document.getElementById("radius");

    const restaurantBody =
      document.getElementById("restaurantBody");

    const locationInfo =
      document.getElementById("locationInfo");

    const meta =
      document.getElementById("meta");

    const empty =
      document.getElementById("empty");


    function render() {

      const locationId =
        locationSelect.value;

      const radius =
        Number(radiusSelect.value);

      const selected =
        locations.find(
          location =>
            location.id === locationId
        );


      const rows =
        restaurants
          .filter(
            restaurant =>
              restaurant.location_id === locationId
          )
          .filter(
            restaurant =>
              Number(restaurant.distance_km) <= radius
          )
          .sort(
            (a, b) =>
              Number(a.distance_km) -
              Number(b.distance_km)
          );


      restaurantBody.innerHTML = "";


      rows.forEach(
        (restaurant, index) => {

          const row =
            document.createElement("tr");


          const values = [

            index + 1,

            restaurant.name,

            restaurant.representative_menu,

            `${restaurant.distance_km} km`,

            restaurant.cost_per_person,

            restaurant.phone

          ];


          values.forEach(
            (value, index) => {

              const cell =
                document.createElement("td");


              if (index === 1) {
                cell.className = "name";
              }


              if (
                index === 5 &&
                !String(value).includes("확인 필요")
              ) {

                cell.className = "phone";

                const link =
                  document.createElement("a");

                link.href =
                  `tel:${String(value).replace(/[^0-9+]/g, "")}`;

                link.textContent =
                  value;

                cell.appendChild(link);

              } else {

                cell.textContent =
                  value;

              }


              row.appendChild(cell);

            }
          );


          restaurantBody.appendChild(row);

        }
      );


      locationInfo.textContent =
        selected
          ? selected.address
          : "";


      meta.textContent =
        `${selected?.name || ""} · 반경 ${radius}km · ${rows.length}곳 표시 · 데이터 기준일 ${updatedAt}`;


      empty.hidden =
        rows.length !== 0;

    }


    async function loadData() {

      const response =
        await fetch("/api/data");


      if (response.status === 401) {

        location.href = "/";

        return;

      }


      const data =
        await response.json();


      locations =
        data.locations;

      restaurants =
        data.restaurants;

      updatedAt =
        data.updated_at;


      locations.forEach(
        location => {

          const option =
            document.createElement("option");

          option.value =
            location.id;

          option.textContent =
            location.name;

          locationSelect.appendChild(option);

        }
      );


      render();

    }


    locationSelect.addEventListener(
      "change",
      render
    );


    radiusSelect.addEventListener(
      "change",
      render
    );


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async () => {

          await fetch(
            "/logout",
            {
              method: "POST"
            }
          );

          location.href = "/";

        }
      );


    loadData();

  </script>

</body>
</html>
