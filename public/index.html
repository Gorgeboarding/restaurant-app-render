<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수원역 단체 식당 검색</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .container { width: min(1180px, 92%); margin: 36px auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 28px; }
    .subtitle { margin: 6px 0 0; color: #666; }
    .logout {
      border: 1px solid #ccc;
      background: white;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
    }
    .search-box {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 20px;
      background: white;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
    input, select {
      width: 100%;
      height: 44px;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 0 12px;
      font-size: 15px;
      background: white;
    }
    .search-btn {
      height: 44px;
      border: 0;
      border-radius: 9px;
      padding: 0 24px;
      background: #202124;
      color: white;
      cursor: pointer;
    }
    .meta {
      margin-bottom: 12px;
      color: #666;
      font-size: 14px;
    }
    .table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 16px;
    }
    table { width: 100%; min-width: 820px; border-collapse: collapse; }
    th, td { padding: 14px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
    th { background: #fafafa; }
    .name { font-weight: 700; }
    .phone a { color: inherit; }
    .empty { padding: 30px; text-align: center; color: #777; }
    @media (max-width: 720px) {
      .topbar { align-items: flex-start; }
      .search-box { grid-template-columns: 1fr; }
      .search-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <h1>수원역 단체 식당 검색</h1>
        <p class="subtitle">10인 이상 예약 가능한 식당 1차 데이터</p>
      </div>
      <button class="logout" id="logoutBtn" type="button">로그아웃</button>
    </header>

    <section class="search-box">
      <div>
        <label for="location">기준 장소</label>
        <input id="location" value="수원역" disabled />
      </div>

      <div>
        <label for="radius">반경</label>
        <select id="radius">
          <option value="1">1 km</option>
          <option value="3">3 km</option>
          <option value="5">5 km</option>
          <option value="10" selected>10 km</option>
        </select>
      </div>

      <button class="search-btn" id="searchBtn" type="button">검색</button>
    </section>

    <div class="meta" id="meta">데이터를 불러오는 중...</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>음식점 이름</th>
            <th>대표메뉴</th>
            <th>수원역 기준 거리</th>
            <th>인당 비용</th>
            <th>전화번호</th>
          </tr>
        </thead>
        <tbody id="restaurantBody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>조건에 맞는 식당이 없습니다.</div>
    </div>
  </div>

  <script>
    let restaurants = [];
    let updatedAt = "";

    const body = document.getElementById("restaurantBody");
    const empty = document.getElementById("empty");
    const meta = document.getElementById("meta");
    const radiusSelect = document.getElementById("radius");

    function render() {
      const radius = Number(radiusSelect.value);
      const filtered = restaurants
        .filter((restaurant) => restaurant.radius_km <= radius)
        .sort((a, b) => a.radius_km - b.radius_km);

      body.innerHTML = "";

      for (const restaurant of filtered) {
        const row = document.createElement("tr");

        const values = [
          restaurant.name,
          restaurant.representative_menu,
          `${restaurant.radius_km} km`,
          restaurant.cost_per_person,
          restaurant.phone
        ];

        values.forEach((value, index) => {
          const cell = document.createElement("td");

          if (index === 0) cell.className = "name";

          if (index === 4) {
            cell.className = "phone";
            const link = document.createElement("a");
            link.href = `tel:${restaurant.phone.replace(/[^0-9+]/g, "")}`;
            link.textContent = value;
            cell.appendChild(link);
          } else {
            cell.textContent = value;
          }

          row.appendChild(cell);
        });

        body.appendChild(row);
      }

      empty.hidden = filtered.length !== 0;
      meta.textContent =
        `반경 ${radius}km · ${filtered.length}곳 표시 · 데이터 기준일 ${updatedAt || "-"}`;
    }

    async function loadRestaurants() {
      try {
        const response = await fetch("/api/restaurants");

        if (response.status === 401) {
          window.location.href = "/";
          return;
        }

        const data = await response.json();

        if (!data.success) throw new Error(data.message);

        restaurants = data.restaurants;
        updatedAt = data.updated_at;
        render();
      } catch (error) {
        meta.textContent = "식당 데이터를 불러오지 못했습니다.";
      }
    }

    document.getElementById("searchBtn").addEventListener("click", render);

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/logout", { method: "POST" });
      window.location.href = "/";
    });

    loadRestaurants();
  </script>
</body>
</html>
